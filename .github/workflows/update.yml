name: Update

on:
  schedule:
    # GitHub 的排程在整點最壅塞，常常延遲好幾個小時或直接被略過。
    # 所以避開整點，而且一小時排三次當備援；下面的 check 會擋掉多餘的執行，
    # 實際上仍然是大約每小時更新一次。
    - cron: "7,27,47 * * * *"
  workflow_dispatch:       # 也可以到 Actions 頁面手動按「Run workflow」（一定會執行）

permissions:
  contents: write   # 把 data.json commit 回 repo
  pages: write      # 部署 GitHub Pages
  id-token: write   # Pages 部署需要

concurrency:
  group: update
  cancel-in-progress: false   # 上一輪還沒跑完就排隊，不要同時跑兩輪

jobs:
  check:
    name: 決定這次要不要更新
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}        # 現在最新的版本，不是排程觸發當下的
          sparse-checkout: data.json
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, sys
          run = True
          if os.environ["EVENT"] == "schedule":
              try:
                  updated = datetime.datetime.fromisoformat(json.load(open("data.json"))["updated_at"])
                  age = (datetime.datetime.now(datetime.timezone.utc) - updated).total_seconds() / 60
                  run = age >= 45
                  print(f"距離上次更新 {age:.0f} 分鐘，{'執行' if run else '跳過'}", file=sys.stderr)
              except Exception as e:
                  print(f"讀不到上次更新時間（{e}），照常執行", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          PY

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 正常只要 1～5 分鐘；卡住時不要佔住排程
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"   # 讓 log 即時輸出；否則執行被取消時一行都看不到
    steps:
      - uses: actions/checkout@v7
        with:
          # 抓「現在」最新的版本。不指定的話會抓排程觸發當下的版本，
          # 排隊等了一陣子才開始跑時，data.json 就是舊的，之後推送一定衝突。
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓 HN、翻譯、更新 data.json
        run: python update.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}   # 沒設定就用程式裡的預設清單

      - name: 把 data.json commit 回 repo
        if: always()   # 上一步中途被取消或逾時，也要把已經翻好的部分存起來
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 沒有變化"
            exit 0
          fi
          git commit -m "更新 data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 這段時間若有人推了別的 commit，先接上去再推；剛好撞在同一秒就重試
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "推送失敗（第 $attempt 次），稍後重試"
            sleep $((attempt * 3))
          done
          exit 1

      - id: pages
        uses: actions/configure-pages@v6

      - name: 產生網頁與 RSS
        run: python build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: 翻譯連續失敗太多次就亮紅燈（GitHub 會寄信通知）
        run: python update.py --check-health
