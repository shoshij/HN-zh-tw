name: Update

on:
  schedule:
    - cron: "0 * * * *"   # 每小時整點（UTC）。GitHub 的排程可能延遲幾分鐘。
  workflow_dispatch:       # 也可以到 Actions 頁面手動按「Run workflow」

permissions:
  contents: write   # 把 data.json commit 回 repo
  pages: write      # 部署 GitHub Pages
  id-token: write   # Pages 部署需要

concurrency:
  group: update
  cancel-in-progress: false   # 上一輪還沒跑完就排隊，不要同時跑兩輪

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 正常只要 1～5 分鐘；卡住時不要佔住排程
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓 HN、翻譯、更新 data.json
        run: python update.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}   # 沒設定就用程式裡的預設清單

      - name: 把 data.json commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 沒有變化"
          else
            git commit -m "更新 data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main   # 這段時間若有人推了別的 commit，先接上去
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: 產生網頁與 RSS
        run: python build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
