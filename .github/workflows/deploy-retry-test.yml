name: Deploy retry test (temporary)

# 暫時的測試流程，測完就刪。驗證 update.yml 裡「部署 Pages 的重試」：
#   probe   只量：artifact 上傳完多久才列得出來（不部署）
#   retry   故意讓前 N 次部署查不到 artifact，看重試步驟有沒有接手
#   natural 上傳完立刻部署一次（修正前的做法），再接正式的重試步驟
# deploy 這個 job 的建置、上傳、部署步驟是從 update.yml 原樣複製的，
# 只多了標 TEST-INJECTION 的行和兩個標 TEST-ONLY 的步驟。
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, retry, natural]
        default: probe
      fail_attempts:
        description: retry 模式：前幾次部署故意失敗
        type: choice
        options: ["0", "1", "2", "3"]
        default: "0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update   # 和正式的 Update 共用：不會同時部署
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 抓「現在」最新的版本。不指定的話會抓排程觸發當下的版本，
          # 排隊等了一陣子才開始跑時，data.json 就是舊的，之後推送一定衝突。
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          name: probe-1
          path: site
      - name: probe probe-1
        uses: actions/github-script@v8
        env:
          PROBE_NAME: probe-1
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

      - uses: actions/upload-pages-artifact@v5
        with:
          name: probe-2
          path: site
      - name: probe probe-2
        uses: actions/github-script@v8
        env:
          PROBE_NAME: probe-2
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

      - uses: actions/upload-pages-artifact@v5
        with:
          name: probe-3
          path: site
      - name: probe probe-3
        uses: actions/github-script@v8
        env:
          PROBE_NAME: probe-3
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

      - uses: actions/upload-pages-artifact@v5
        with:
          name: probe-4
          path: site
      - name: probe probe-4
        uses: actions/github-script@v8
        env:
          PROBE_NAME: probe-4
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

      - uses: actions/upload-pages-artifact@v5
        with:
          name: probe-5
          path: site
      - name: probe probe-5
        uses: actions/github-script@v8
        env:
          PROBE_NAME: probe-5
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

  deploy:
    if: inputs.mode != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # 抓「現在」最新的版本。不指定的話會抓排程觸發當下的版本，
          # 排隊等了一陣子才開始跑時，data.json 就是舊的，之後推送一定衝突。
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v6

      - name: 產生網頁與 RSS
        run: python build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # TEST-ONLY：retry 模式先等到 artifact 列得出來，讓故意失敗的次數就是實際失敗的次數
      - name: probe github-pages
        if: inputs.mode == 'retry'
        uses: actions/github-script@v8
        env:
          PROBE_NAME: github-pages
        with:
          script: |
            const want = process.env.PROBE_NAME;
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const origin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').map(s => s.split(':')).find(p => p[0] === 'Actions.Results');
            // same request deploy-pages makes through @actions/artifact listArtifacts()
            const body = JSON.stringify({ workflow_run_backend_id: scope[1], workflow_job_run_backend_id: scope[2] });
            const start = Date.now();
            let polls = 0, last = null;
            for (;;) {
              polls++;
              const res = await fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body,
              });
              const ms = Date.now() - start;
              const names = res.ok ? ((await res.json()).artifacts || []).map(a => a.name) : null;
              const state = names ? JSON.stringify(names) : `HTTP ${res.status}`;
              if (state !== last) { console.log(`PROBE ${want} poll=${polls} +${ms}ms listing=${state}`); last = state; }
              if (names && names.includes(want)) { console.log(`PROBE ${want} VISIBLE polls=${polls} +${ms}ms`); break; }
              if (ms > 150000) { console.log(`PROBE ${want} NOT-VISIBLE polls=${polls} +${ms}ms`); break; }
              await new Promise(r => setTimeout(r, ms < 15000 ? 200 : 1000));
            }

      # TEST-ONLY：natural 模式重現修正前的做法（上傳完立刻部署、只試一次）
      - id: before_fix
        if: inputs.mode == 'natural'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - run: sleep 5

      - id: deploy
        uses: actions/deploy-pages@v5
        with:   # TEST-INJECTION
          artifact_name: ${{ fromJSON(inputs.fail_attempts) >= 1 && 'missing-on-purpose' || 'github-pages' }}   # TEST-INJECTION
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 15

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:   # TEST-INJECTION
          artifact_name: ${{ fromJSON(inputs.fail_attempts) >= 2 && 'missing-on-purpose' || 'github-pages' }}   # TEST-INJECTION
        continue-on-error: true

      - if: steps.deploy2.outcome == 'failure'
        run: sleep 45

      - id: deploy3   # 最後一次：還是失敗才亮紅燈
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:   # TEST-INJECTION
          artifact_name: ${{ fromJSON(inputs.fail_attempts) >= 3 && 'missing-on-purpose' || 'github-pages' }}   # TEST-INJECTION

      - name: 部署之後的步驟（代替正式流程最後的健康檢查）
        run: echo "after-deploy step reached; url=${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}"
